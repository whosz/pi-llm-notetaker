<li id="item-{{ item.id }}" class="py-2">
  <div role="group" class="field" data-orientation="horizontal">
    <input
      type="checkbox"
      class="input"
      id="item-check-{{ item.id }}"
      {% if item.checked %}checked{% endif %}
      hx-post="/items/{{ item.id }}/toggle"
      hx-trigger="change"
      hx-target="#item-{{ item.id }}"
      hx-swap="outerHTML"
    />
    <label
      for="item-check-{{ item.id }}"
      class="{{ 'line-through text-muted-foreground' if item.checked else '' }}"
      >{{ item.text }}</label
    >
  </div>
</li>
