<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PiLLm Note Taker{% endblock %}</title>
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <link rel="stylesheet" href="/static/basecoat.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-4">
    <header class="mb-4">
      <div class="relative mb-4">
        <input
          class="input search-pill"
          type="search"
          name="q"
          placeholder="Find notes"
          value="{{ q or '' }}"
          hx-get="/notes-list{% if type %}?type={{ type }}{% endif %}"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#notes-list"
          hx-swap="innerHTML"
        />
        <svg
          class="search-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      </div>
      <nav class="tab-nav flex flex-wrap gap-4">
        {% for label, type in [("All", none), ("Shopping", "shopping"), ("Tasks", "task"),
        ("Meetings", "meeting"), ("Quotes", "quote"), ("Ideas", "idea")] %}
        <a
          href="{{ '/' if type is none else '/?type=' + type }}"
          class="{{ 'active' if type == active_type else '' }}"
          >{{ label }}</a
        >
        {% endfor %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
